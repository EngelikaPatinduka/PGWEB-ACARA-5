<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">FLores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-box-arrow-up-right"></i> SV UGM </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="bi bi-info-circle"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th style="width: 25%;">Nama</th>
                            <td>Engelika Adriana Patinduka</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/568101/SV/27362</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>B</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel"><i class="bi bi-info-circle"></i> Info Penduduk</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3181878, 123.1656647], 11);

        // Map Panes
        map.createPane("pane_jalan");
        map.getPane("pane_jalan").style.zIndex = 400;

        map.createPane("pane_jumlah_penduduk");
        map.getPane("pane_jumlah_penduduk").style.zIndex = 300;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi
        var toponimi = L.geoJSON(null, {
            // Style
            pointToLayer: function (feature, latlng) {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: "images/home_marker.png", // icon marker
                        iconSize: [48, 48], // ukuran icon
                        iconAnchor: [24, 48], // posisi icon terhadap titik (point)
                        popupAnchor: [0, -48], // posisi popup terhadap icon
                        tooltipAnchor: [-16, -30], // posisi tooltip terhadap icon
                    }),
                });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "<img src='images/" + feature.properties.image + "' alt='' width='100%' style='max-width:200px; height:auto;'><br>" +
                    "Nama: " + feature.properties.TOPONIMI + "<br>" +
                    "Koordinat: " + feature.geometry.coordinates[1] + ", " + feature.geometry.coordinates[0];

                layer.on({

                    click: function (e) {
                        toponimi.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        toponimi.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "left",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("GeoJSON/toponimi.geojson", function (data) {
            toponimi.addData(data); // Menambahkan data ke dalam GeoJSON Point Toponimi
            map.addLayer(toponimi); // Menambahkan GeoJSON Point Toponimi ke dalam peta
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: "pane_jalan",
            // Style
            style: function (feature) {
                var namaUnsur = (feature.properties.NAMA_UNSUR || "").toLowerCase();
                if (namaUnsur.includes("provin") || namaUnsur.includes("propin")) {
                    return {
                        color: "red",
                        weight: 3,
                        opacity: 1,
                    };
                }
                if (namaUnsur.includes("kabupaten")) {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "10, 8",
                        opacity: 1,
                    };
                }
                return {
                    color: "red",
                    weight: 0.5,
                    dashArray: "3, 4",
                    opacity: 1,
                };
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // variable popup content
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        jalan.bindPopup(popup_content);
                    },
                    mouseover: function (e) {
                        jalan.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },

        });

        $.getJSON("GeoJSON/jalan.geojson", function (data) {
            jalan.addData(data); // Menambahkan data ke dalam GeoJSON Polyline Jalan
            map.addLayer(jalan); // Menambahkan GeoJSON Polyline Jalan ke dalam peta
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "pane_jumlah_penduduk",
            // Style
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    }
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    }
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    }
                }
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        var modalContent = "<table class='table table-striped table-bordered mb-0'>" +
                            "<tr><th style='width: 40%;'>Kecamatan</th><td>" + feature.properties.WADMKC + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + Number(feature.properties.Penduduk).toLocaleString('id-ID') + " Jiwa</td></tr>";
                        if (feature.properties.luas_km2) {
                            modalContent += "<tr><th>Luas Wilayah</th><td>" + feature.properties.luas_km2 + " km&sup2;</td></tr>";
                        }
                        modalContent += "</table>";

                        document.getElementById("pendudukModalLabel").innerHTML = "<i class='bi bi-info-circle'></i> Kecamatan " + feature.properties.WADMKC;
                        document.getElementById("pendudukModalBody").innerHTML = modalContent;

                        var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("pendudukModal"));
                        modal.show();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.WADMKC, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });
        $.getJSON("GeoJSON/jumah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data); // Menambahkan data ke dalam GeoJSON Polygon Jumlah Penduduk
            map.addLayer(jumlah_penduduk); // Menambahkan GeoJSON Polygon Jumlah Penduduk ke dalam peta
        });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": basemap,
        };

        var legenda_penduduk = "Jumlah Penduduk<br>" +
            "<div style='margin-left: 20px; font-size: 11px; line-height: 1.6;'>" +
            "<i style='background: #ffffb2; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> &le; 12.000 Jiwa<br>" +
            "<i style='background: #fd8d3c; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> 12.001 - 24.000 Jiwa<br>" +
            "<i style='background: #bd0026; width: 12px; height: 12px; display: inline-block; border: 1px solid black; vertical-align: middle; margin-right: 4px;'></i> &gt; 24.000 Jiwa" +
            "</div>";

        var legenda_jalan = "Jalan<br>" +
            "<div style='margin-left: 20px; font-size: 11px; line-height: 1.6;'>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='3'/></svg> Jalan Provinsi<br>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='1.5' stroke-dasharray='8, 4'/></svg> Jalan Kabupaten<br>" +
            "<svg width='24' height='10' style='vertical-align: middle; margin-right: 4px;'><line x1='0' y1='5' x2='24' y2='5' stroke='red' stroke-width='1' stroke-dasharray='2, 3'/></svg> Jalan Lain" +
            "</div>";

        var overlayMaps = {
            "<img src='images/home_marker.png' width='18' style='vertical-align: middle; margin-right: 4px;'> Toponimi": toponimi,
        };
        overlayMaps[legenda_jalan] = jalan;
        overlayMaps[legenda_penduduk] = jumlah_penduduk;

        var controllayer = L.control.layers(baseMaps, overlayMaps, { collapsed: false });
        controllayer.addTo(map);

        // Scale Bar
        L.control.scale({
            position: "bottomleft",
        }).addTo(map);
    </script>
</body>

</html>
