<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS - Flores Timur</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Font Awesome CSS (untuk ikon Awesome Markers) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <!-- Leaflet.awesome-markers CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css" />

    <style>
        html,
        body,
        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-box-arrow-up-right"></i> SV UGM </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal"><i
                                class="bi bi-info-circle"></i> About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="bi bi-info-circle"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th style="width: 25%;">Nama</th>
                            <td>Engelika Adriana Patinduka</td>
                        </tr>
                        <tr>
                            <th>NIM</th>
                            <td>25/568101/SV/27362</td>
                        </tr>
                        <tr>
                            <th>Kelas</th>
                            <td>B</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel"><i class="bi bi-info-circle"></i> Info Penduduk
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Library JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Leaflet.awesome-markers JS -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.min.js"></script>

    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.3181878, 123.1656647], 11);

        // Map Panes
        map.createPane("pane_jalan");
        map.getPane("pane_jalan").style.zIndex = 400;

        map.createPane("pane_jumlah_penduduk");
        map.getPane("pane_jumlah_penduduk").style.zIndex = 300;

        // Tile Layer Base Map
        var basemap = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        // Menambahkan basemap ke dalam peta
        basemap.addTo(map);

        // GeoJSON Point Toponimi dengan Leaflet.awesome-markers
        var toponimi = L.geoJSON(null, {
            // Style Marker berdasarkan field NAMA_UNSUR
            pointToLayer: function (feature, latlng) {
                var namaUnsur = feature.properties.NAMA_UNSUR;
                var iconName = "location-dot";
                var markerColor = "green";

                if (namaUnsur === "Gunung") {
                    iconName = "mountain";
                    markerColor = "red";
                } else if (namaUnsur === "Tanjung") {
                    iconName = "compass";
                    markerColor = "orange";
                } else if (namaUnsur === "Teluk") {
                    iconName = "water";
                    markerColor = "cadetblue";
                } else if (namaUnsur === "Toponimi") {
                    iconName = "location-dot";
                    markerColor = "green";
                }

                // Membuat Icon Awesome Markers
                var awesomeIcon = L.AwesomeMarkers.icon({
                    icon: iconName,
                    prefix: "fa",
                    markerColor: markerColor,
                    iconColor: "white"
                });

                return L.marker(latlng, { icon: awesomeIcon });
            },

            // onEachFeature
            onEachFeature: function (feature, layer) {
                // Image tag jika gambar ada
                var imageHtml = feature.properties.image
                    ? "<img src='images/" + feature.properties.image + "' alt='' width='100%' style='max-width:200px; height:auto;'><br>"
                    : "";

                var popup_content = imageHtml +
                    "<b>Nama:</b> " + feature.properties.TOPONIMI + "<br>" +
                    "<b>Unsur:</b> " + feature.properties.NAMA_UNSUR + "<br>" +
                    "<b>Koordinat:</b> " + feature.geometry.coordinates[1].toFixed(5) + ", " + feature.geometry.coordinates[0].toFixed(5);

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.TOPONIMI, {
                            direction: "top",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/toponimi.geojson", function (data) {
            toponimi.addData(data);
            map.addLayer(toponimi);
        });

        // GeoJSON Polyline Jalan
        var jalan = L.geoJSON(null, {
            pane: "pane_jalan",
            style: function (feature) {
                var namaUnsur = (feature.properties.NAMA_UNSUR || "").toLowerCase();
                if (namaUnsur.includes("provin") || namaUnsur.includes("propin")) {
                    return {
                        color: "red",
                        weight: 3,
                        opacity: 1,
                    };
                }
                if (namaUnsur.includes("kabupaten")) {
                    return {
                        color: "red",
                        weight: 1.5,
                        dashArray: "10, 8",
                        opacity: 1,
                    };
                }
                return {
                    color: "red",
                    weight: 0.5,
                    dashArray: "3, 4",
                    opacity: 1,
                };
            },

            onEachFeature: function (feature, layer) {
                var popup_content = "Fungsi: " + feature.properties.NAMA_UNSUR + "<br>" +
                    "Panjang (km): " + feature.properties.panjang_km;

                layer.on({
                    click: function (e) {
                        layer.bindPopup(popup_content).openPopup();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.NAMA_UNSUR, {
                            direction: "auto",
                            sticky: true,
                        });
                    },
                });
            },
        });

        $.getJSON("GeoJSON/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
        });

        // GeoJSON Polygon Jumlah Penduduk
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "pane_jumlah_penduduk",
            style: function (feature) {
                if (feature.properties.Penduduk <= 12000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffb2'
                    };
                }
                if (feature.properties.Penduduk > 12000 && feature.properties.Penduduk <= 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c'
                    };
                }
                if (feature.properties.Penduduk > 24000) {
                    return {
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026'
                    };
                }
            },

            onEachFeature: function (feature, layer) {
                layer.on({
                    click: function (e) {
                        var modalContent = "<table class='table table-striped table-bordered mb-0'>" +
                            "<tr><th>Kecamatan / Wilayah</th><td>" + (feature.properties.WADMKC || feature.properties.NAMOBJ || "N/A") + "</td></tr>" +
                            "<tr><th>Jumlah Penduduk</th><td>" + (feature.properties.Penduduk ? feature.properties.Penduduk.toLocaleString() : "-") + " Jiwa</td></tr>" +
                            "</table>";
                        $("#pendudukModalBody").html(modalContent);
                        var myModal = new bootstrap.Modal(document.getElementById('pendudukModal'));
                        myModal.show();
                    },
                    mouseover: function (e) {
                        layer.bindTooltip(feature.properties.WADMKC || feature.properties.NAMOBJ || "Wilayah", {
                            direction: "auto",
                            sticky: true,
                        });
                    }
                });
            }
        });

        $.getJSON("GeoJSON/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
        });
    </script>
</body>

</html>
